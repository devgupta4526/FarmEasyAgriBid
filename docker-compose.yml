version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agribid_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agribid
      POSTGRES_USER: agribid_user
      POSTGRES_PASSWORD: agribid_dev_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/src/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agribid_user -d agribid"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agribid_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: agribid_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://agribid_user:agribid_dev_password_change_in_prod@postgres:5432/agribid
    ports:
      - "4000:4000"
    volumes:
      - ./apps/backend/src:/app/src
    env_file:
      - .env

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: agribid_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000/api/v1
    ports:
      - "3000:3000"
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
